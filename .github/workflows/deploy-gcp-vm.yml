name: Test, build, and deploy to VPS

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Run regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free unused runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker image prune --all --force
      - uses: astral-sh/setup-uv@v5
      - name: Install test dependencies
        run: uv sync --extra api --extra bedrock --extra postgres-memory --extra redis-cache --extra gnani-stt --extra google-calendar --extra test
      - name: Run tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py'

  deploy:
    name: Build, deploy, and verify VPS
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_DEPLOY_HOST: ${{ vars.VPS_DEPLOY_HOST }}
      VPS_DEPLOY_USER: ${{ vars.VPS_DEPLOY_USER }}
      VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure pinned SSH connection
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Deploy checked-out production revision
        run: |
          ssh -o BatchMode=yes "$VPS_DEPLOY_USER@$VPS_DEPLOY_HOST" '
            set -Eeuo pipefail
            cd /opt/voice-agent/app
            git fetch origin master --depth=1
            git checkout --detach origin/master
            sudo docker compose --env-file .env.local-cloud \
              -f docker-compose.local-cloud.yml -f docker-compose.vps.yml \
              up -d --build --remove-orphans
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error http://127.0.0.1:8080/healthz >/dev/null; then
                exit 0
              fi
              sleep 5
            done
            sudo docker compose --env-file .env.local-cloud \
              -f docker-compose.local-cloud.yml -f docker-compose.vps.yml ps
            exit 1
          '
