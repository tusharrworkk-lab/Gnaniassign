# Production overlay for the single GCP VM. The base compose file owns the
# persistent PostgreSQL/Redis volumes and networking; this file replaces only
# the API image and locks the environment to production.
services:
  api:
    image: ${AGENT_IMAGE:?Set AGENT_IMAGE to the Artifact Registry image URI}
    # The deploy script pulls the immutable release before `up`. Keeping the
    # default/missing policy lets rollback reuse the previous local image.
    pull_policy: missing
    environment:
      AGENT_ENVIRONMENT: production
