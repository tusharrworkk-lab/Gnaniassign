[project]
name = "gnaniassignment"
version = "0.1.0"
description = "Intent-routed enquiry assistant with compressed conversational memory"
readme = "README.md"
authors = [
    { name = "tusharrworkk-lab", email = "tusharrworkk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "indic-transliteration>=2.3.82",
    "langgraph",
    "langsmith>=0.14.7",
    "openai",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
local-laya = ["laya", "torch"]
local-laya-fast = ["laya[fast]", "torch"]
gnani-stt = ["websockets"]
decision-model = ["scikit-learn"]
transformers-experiment = ["transformers", "accelerate", "torch", "datasets", "sentencepiece", "protobuf>=4"]
retail-classifier = ["transformers", "torch"]
vllm = ["vllm"]
gemini = ["google-genai"]
bedrock = ["boto3"]
postgres-memory = ["psycopg[binary]>=3.2"]
redis-cache = ["redis>=5"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
gnaniassignment = "gnaniassignment:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
