[project]
name = "gnaniassignment"
version = "0.1.0"
description = "Intent-routed enquiry assistant with compressed conversational memory"
readme = "README.md"
authors = [
    { name = "tusharrworkk-lab", email = "tusharrworkk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "requests",
]

[project.optional-dependencies]
local-laya = ["laya", "torch"]
transformers-experiment = ["transformers", "accelerate", "torch"]

[project.scripts]
gnaniassignment = "gnaniassignment:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
